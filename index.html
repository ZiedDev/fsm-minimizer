<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>digital-logic-2</title>
</head>

<body>
  <div id="app">
    <div class="transition-table">
      <div class="header">
        <h2 class="title">Transition Table</h2>
        <div class="mode">
          <p>Mealy</p>
          <input type="checkbox" name="" id="is-moore-check" checked>
          <p>Moore</p>
        </div>
        <div class="number-of-inputs">
          <p>Number of Inputs</p>
          <input type="number" id="number-of-inputs-input" oninput="this.value = [1,2,3].includes(+this.value) ? this.value : ''" min="1" max="3"  value="1" >
        </div>
      </div>

      <div class="table-header">
        <h3>Present State</h3>
        <h3>Next State</h3>
        <h3>Output</h3>
      </div>

      <div class="subheader">
        <div class="present-state"></div>
        <div class="next-state">
          <p>X = 0</p>
          <p>X = 1</p>
        </div>
        <div class="output" id="subheader-output">
        </div>
      </div>

      <div class="content" id="transition-table-content"></div>

      <div class="add-button">
        <button id="add-row-button">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"
            viewBox="0 0 24 24"><!-- Icon from Solar by 480 Design - https://creativecommons.org/licenses/by/4.0/ -->
            <g fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10" />
              <path stroke-linecap="round" d="M15 12h-3m0 0H9m3 0V9m0 3v3" />
            </g>
          </svg>
        </button>
      </div>
    </div>
    
    <button class="generate-button" id="generate-button">
      <h3>Generate Implication Table</h3>
    </button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
