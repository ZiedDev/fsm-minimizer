      </div>
      <div class="content"></div>
      <div class="implication-table-next-button">
        <button>
          <h3>Continue</h3>
        </button>
      </div>
    </div>

    <div class="equivalence-diagram hide" id="equivalence-diagram">
      <div class="header">
        <h2 class="title">Equivalence Classes Visualization</h2>
      </div>
      <div class="content">
        <svg id="equivalence-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="legend" id="equivalence-legend"></div>
      </div>
      <div class="equivalence-diagram-next-button">
        <button>
          <h3>Continue</h3>
        </button>
      </div>
    </div>

    <div class="minimized-table hide" id="minimized-table">
      <div class="header"></div>
      <div class="content"></div>
      <div class="comment invisible"></div>
